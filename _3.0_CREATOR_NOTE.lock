<p>If you've made it this far and still want to give Sanguis a chance, I don't have words to express how grateful and humbled I am. Without you, and the people who helped make VolkanaDEV a reality, my dream of a better future for all of us may be just that forever. A dream.</p>
          <p>I hope you share that dream with me, and want it to come true. From the bottom of my heart. Thank you.</p>
          <p>Thank you to everyone that believes in me, taught me, loved me, hated me, or helped me survive. I love you mom and dad.</p>
